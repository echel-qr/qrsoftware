<!DOCTYPE html>
<!-- Link-preview picture (1200x630). Rendered by build-images.py; not a public page. -->
<html lang="en"><head><meta charset="utf-8"><style>
@font-face{font-family:'Noto Sans Meetei Mayek';src:url('{{MEITEI_FONT}}')}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#fff}
body{font-family:'Segoe UI','Noto Sans Meetei Mayek',sans-serif;color:#16181b;position:relative}
.glow{position:absolute;left:30px;top:55px;width:470px;height:470px;border-radius:50%;background:radial-gradient(circle,#eef0f2 0%,#f5f6f7 55%,#fff 72%)}
.logo{position:absolute;left:100px;top:135px;width:330px;height:330px;filter:drop-shadow(0 22px 22px rgba(20,24,28,.22))}
.copy{position:absolute;left:500px;top:92px;right:60px}
.kicker{font-size:22px;font-weight:700;letter-spacing:1.6px;color:#c81e28}
h1{font-family:'Segoe UI Black','Segoe UI',sans-serif;font-weight:900;font-size:118px;line-height:1;letter-spacing:-3px;margin:10px 0 18px}
.line{font-size:52px;font-weight:600;line-height:1.2;letter-spacing:-.8px}
.line.red{color:#c81e28}
.sub{font-size:28px;color:#5d646b;margin:12px 0 22px}
.chips{display:flex;gap:12px}
.chip{border:2px solid #d9dde1;background:#f1f3f5;border-radius:26px;padding:8px 20px;font-size:22px;font-weight:600}
.foot{position:absolute;left:500px;right:60px;bottom:40px;display:flex;justify-content:space-between;align-items:center}
.site{font-size:30px;font-weight:700}
.lang{border:2px solid #d9dde1;background:#f1f3f5;border-radius:24px;padding:6px 18px;font-size:20px;font-weight:600}
.bar{position:absolute;left:0;right:0;bottom:0;height:12px;background:#c81e28}
</style></head><body>
<div class="glow"></div>
<img class="logo" src="{{LOGO}}" alt="">
<div class="copy">
  <div class="kicker">AUTO-PRINT SOFTWARE</div>
  <h1>Echel</h1>
  <div class="line">Scan a QR.</div>
  <div class="line red">Print automatically.</div>
  <div class="sub">For cyber cafes and print shops</div>
  <div class="chips"><span class="chip">No WhatsApp</span><span class="chip">No pen drive</span><span class="chip">Free demo</span></div>
</div>
<div class="foot"><span class="site">echel.in</span><span class="lang">English · ꯃꯤꯇꯩꯂꯣꯟ</span></div>
<div class="bar"></div>
</body></html>
